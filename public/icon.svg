<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#deskGrad)" />

  <!-- Accent Circle -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.07" />

  <!-- StudyDesk Emblem -->
  <g filter="url(#shadow)">
    <!-- Open Book / Document Base -->
    <path d="M128 340 C170 320, 220 320, 256 338 C292 320, 342 320, 384 340 L384 190 C342 170, 292 170, 256 188 C220 170, 170 170, 128 190 Z" fill="#ffffff" />
    
    <!-- Spine Divider -->
    <path d="M256 188 L256 338" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Page Content lines -->
    <line x1="160" y1="218" x2="228" y2="218" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="160" y1="248" x2="228" y2="248" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="160" y1="278" x2="210" y2="278" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

    <!-- Right Page Focus Spark / Graph Nodes -->
    <circle cx="300" cy="230" r="10" fill="#2563eb" />
    <circle cx="346" cy="216" r="7" fill="#0284c7" />
    <circle cx="334" cy="270" r="8" fill="#38bdf8" />
    <line x1="300" y1="230" x2="346" y2="216" stroke="#0284c7" stroke-width="4" />
    <line x1="300" y1="230" x2="334" y2="270" stroke="#38bdf8" stroke-width="4" />

    <!-- Scholar Cap / Fast Badge above Book -->
    <polygon points="256,120 320,146 256,172 192,146" fill="#facc15" />
    <path d="M216 160 L216 186 C216 198, 296 198, 296 186 L296 160" fill="none" stroke="#eab308" stroke-width="5" />
    <line x1="320" y1="146" x2="332" y2="175" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
    <circle cx="333" cy="180" r="4" fill="#ca8a04" />
  </g>
</svg>
